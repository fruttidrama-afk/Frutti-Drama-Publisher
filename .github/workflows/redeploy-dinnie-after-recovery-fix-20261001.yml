name: Redeploy Dinnie after recovery fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/redeploy-dinnie-after-recovery-fix-20261001.yml"

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request Dinnie unattended runtime redeploy
        shell: bash
        run: |
          set -euo pipefail
          redeploy_url="https://wrflttnmlrsuzuukdhtf.supabase.co/functions/v1/dinnie-unattended-runtime-redeploy-20260927"
          health_url="https://dinnie-the-dinosaur-production.up.railway.app/factory/health"
          curl -fsSL --max-time 60 "$redeploy_url"
          echo
          for i in $(seq 1 24); do
            sleep 10
            body="$(curl -fsSL --max-time 20 "$health_url" || true)"
            if [ -n "$body" ] && [ "$(echo "$body" | jq -r '.worker_alive // false')" = "true" ] && [ "$(echo "$body" | jq -r '.scheduler_alive // false')" = "true" ] && [ "$(echo "$body" | jq -r '.automation_provider // ""')" = "FreeBrowserProvider" ]; then
              echo "$body" | jq '{at,worker_alive,scheduler_alive,automation_provider,publication_provider,provider_health,current_job,queue,completed_today,remaining_today,last_generation,last_publication}'
              exit 0
            fi
          done
          echo "::error::Dinnie runtime did not return healthy after redeploy"
          exit 1

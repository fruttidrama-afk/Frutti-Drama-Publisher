name: Hotfix Earth autonomous recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-earth-recovery-20261001.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch strict Flow asset recovery
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check free-browser-provider.js
          npm test --if-present
      - name: Commit Earth recovery fix
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- free-browser-provider.js)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-browser-provider.js
          git commit -m "Fix Earth recovery under Flow grid virtualization"
          git push

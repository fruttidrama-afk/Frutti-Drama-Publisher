name: Free Runtime Runner

on:
  workflow_dispatch:
    inputs:
      publisher_id:
        description: Publisher ID
        required: true
        type: string
      obligation_id:
        description: Durable obligation ID
        required: true
        type: string
      kind:
        description: generation or publication
        required: true
        type: choice
        options: [generation, publication]
      local_day:
        description: Publisher local day
        required: true
        type: string
      ordinal:
        description: Daily ordinal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: free-runtime-${{ inputs.publisher_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLISHER_ID: ${{ inputs.publisher_id }}
      OBLIGATION_ID: ${{ inputs.obligation_id }}
      OBLIGATION_KIND: ${{ inputs.kind }}
      OBLIGATION_DAY: ${{ inputs.local_day }}
      OBLIGATION_ORDINAL: ${{ inputs.ordinal }}
      FREE_RUNTIME_ORCHESTRATOR_URL: ${{ secrets.FREE_RUNTIME_ORCHESTRATOR_URL }}
      FREE_RUNTIME_RUNNER_SECRET: ${{ secrets.FREE_RUNTIME_RUNNER_SECRET }}
      FREE_RUNTIME_STATE_KEY: ${{ secrets.FREE_RUNTIME_STATE_KEY }}
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Infrastructure contract preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FREE_RUNTIME_ORCHESTRATOR_URL"
          test -n "$FREE_RUNTIME_RUNNER_SECRET"
          test -n "$FREE_RUNTIME_STATE_KEY"
          command -v openssl
          command -v tar
          command -v google-chrome
          node --version

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute one durable obligation
        run: node scripts/free-runtime-runner.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-runtime-${{ inputs.publisher_id }}-${{ inputs.obligation_id }}
          path: |
            ${{ runner.temp }}/publisher-free-runtime/runtime.log
          if-no-files-found: ignore
          retention-days: 3

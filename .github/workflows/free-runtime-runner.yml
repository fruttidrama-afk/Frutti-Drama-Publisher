name: Free Runtime Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-runtime-runner.yml"
      - "scripts/free-runtime-runner.mjs"
      - "free-browser-provider.js"
      - "unattended-supervisor.js"
      - "server.js"
  workflow_dispatch:
    inputs:
      publisher_id:
        description: Optional Publisher UUID for a targeted Golden Test
        required: false
        type: string
      kind:
        description: Optional targeted obligation kind
        required: false
        type: choice
        options: ["", generation, publication]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publisher-free-runtime-global
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FREE_RUNTIME_ORCHESTRATOR_URL: https://wrflttnmlrsuzuukdhtf.supabase.co/functions/v1/publisher-free-runtime
      MANUAL_PUBLISHER_ID: ${{ inputs.publisher_id || '' }}
      MANUAL_KIND: ${{ inputs.kind || '' }}
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Free-runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          command -v tar
          command -v google-chrome
          node --version
          node --check scripts/free-runtime-runner.mjs

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Claim and execute one durable obligation
        run: node scripts/free-runtime-runner.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-runtime-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/publisher-free-runtime/runtime.log
          if-no-files-found: ignore
          retention-days: 3

name: Bootstrap Flow Frutti Account V2

on:
  push:
    branches: [main]
    paths:
      - "ops/trigger-flow-frutti-v2.txt"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: publisher-flow-frutti-bootstrap-v2
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DISPLAY: ':99'
      TARGET_KEY: frutti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Verify live owner-initiated reconnection request
        run: node scripts/bootstrap-flow-account-v2.mjs authorize
      - name: Install browser bridge
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 sudo apt-get update -qq
          timeout 180 sudo apt-get install -y -qq xvfb x11vnc novnc websockify curl
          timeout 90 curl -L --fail --retry 3 -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          timeout 180 npm install --ignore-scripts --no-audit --no-fund
      - name: Bootstrap isolated Frutti Flow account
        run: bash scripts/run-flow-account-bootstrap-v2.sh
      - name: Verify captured Google Flow state once from a new isolated runner
        if: success()
        env:
          GH_COLD_RESTORE_DISPATCH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-one-flow-cold-check.mjs


name: Publish Publisher Runtime Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "server.js"
      - "runtime-config.js"
      - "runtime-init.js"
      - "free-browser-provider.js"
      - "flow-bootstrap.js"
      - "publication.js"
      - "publication-facebook.js"
      - "facebook-publication-selftest.mjs"
      - "runtime-fresh-start-selftest.mjs"
      - "publisher-selftest.mjs"
      - "verify-runtime-contract.mjs"
      - "publisher.config.schema.json"
      - "publication-copy.js"
      - "review-storage.js"
      - "public/**"
      - "GOOGLE_FLOW_AUTOMATION_MASTER_SOP.md"
      - "GOOGLE_FLOW_AUTOMATION_SOP.json"
      - "FLOW_AI_IMPLEMENTATION_BRIEF.md"
      - "FLOW_RECOVERY_RUNBOOK.md"
      - "FLOW_GOLDEN_TEST.md"
      - "FLOW_FAILURE_CATALOG.md"
      - "FLOW_CHANGELOG.md"
      - "FLOW_SOP_KNOWLEDGE_MANIFEST.json"
      - ".github/workflows/publish-runtime-image.yml"
  workflow_dispatch:

concurrency:
  group: publisher-runtime-image-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/fruttidrama-afk/publisher-runtime
          tags: |
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/fruttidrama-afk/Frutti-Drama-Publisher
            org.opencontainers.image.description=Publisher Factory autonomous publisher runtime
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

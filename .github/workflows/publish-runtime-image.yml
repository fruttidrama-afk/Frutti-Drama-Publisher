name: Publish Publisher Runtime Image

on:
  push:
    branches: [main]
    paths:
      - "runtime-release.txt"
      - "Dockerfile"
      - "package.json"
      - "*.js"
      - "*.mjs"
      - "publisher.config.schema.json"
      - "public/**"
      - "GOOGLE_FLOW_AUTOMATION_MASTER_SOP.md"
      - "GOOGLE_FLOW_AUTOMATION_SOP.json"
      - "FLOW_*.md"
      - "FLOW_*.json"
      - ".github/workflows/publish-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publisher-runtime-image-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish canonical runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fruttidrama-afk/publisher-runtime:latest
            ghcr.io/fruttidrama-afk/publisher-runtime:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/fruttidrama-afk/Frutti-Drama-Publisher
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: FruttiDrama Human Recovery and Creative Package

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/publisher-frutti-recap/**"
      - "scripts/test-frutti-copy.mjs"
      - "docs/frutti-recap.js"
      - "factory-web/public/frutti-recap.js"
      - "docs/index.html"
      - "factory-web/public/index.html"
      - "runtime-config.js"
      - "runtime-init.js"
      - "frutti-creative-package.js"
      - "free-browser-provider.js"
      - "publication.js"
      - "server.js"
      - "scripts/test-frutti-manual-recovery.mjs"
      - ".github/workflows/frutti-metadata-fidelity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frutti-metadata-fidelity
  cancel-in-progress: false

jobs:
  human-and-source-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Syntax
        run: |
          node --check scripts/test-frutti-copy.mjs
          node --check scripts/test-frutti-manual-recovery.mjs
          node --check frutti-creative-package.js
          node --check runtime-config.js
          node --check free-browser-provider.js
          node --check publication.js
          node --check server.js
          node --check docs/frutti-recap.js
      - name: Historical/manual copy and source-package regression
        run: node scripts/test-frutti-manual-recovery.mjs

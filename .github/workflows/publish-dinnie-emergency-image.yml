name: Publish Dinnie Emergency Runtime Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dinnie-emergency-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dinnie-emergency-runtime-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fruttidrama-afk/publisher-runtime:dinnie-emergency-facebook-auth
          labels: |
            org.opencontainers.image.source=https://github.com/fruttidrama-afk/Frutti-Drama-Publisher
            org.opencontainers.image.description=Dinnie emergency publisher runtime
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Redeploy Dinnie on Railway
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.DINNIE_RAILWAY_TOKEN || secrets.RAILWAY_TOKEN || secrets.RAILWAY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::No Dinnie Railway project token is configured in GitHub Actions."
            exit 1
          fi
          npx -y @railway/cli@latest service redeploy --service dinnie-the-dinosaur --yes

      - name: Verify Dinnie live runtime
        shell: bash
        run: |
          set -euo pipefail
          url="https://dinnie-the-dinosaur-production.up.railway.app/factory/health"
          for attempt in $(seq 1 18); do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if echo "$body" | grep -q '"quarantined_submit_recovery_self_heal":true' \
              && echo "$body" | grep -q '"zero_use_credit_rollover_self_heal":true'; then
              echo "Dinnie is live on the current autonomous runtime."
              echo "$body" | head -c 8000
              exit 0
            fi
            echo "Waiting for Dinnie runtime rollout (attempt $attempt/18)..."
            sleep 10
          done
          echo "::error::Dinnie did not expose the current runtime after redeploy."
          exit 1


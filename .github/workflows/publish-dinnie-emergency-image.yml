name: Publish Dinnie Emergency Runtime Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dinnie-emergency-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dinnie-emergency-runtime-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "23e0993b7ce3d14aa796696332847d736c84ec18"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fruttidrama-afk/publisher-runtime:dinnie-emergency-facebook-auth
          labels: |
            org.opencontainers.image.source=https://github.com/fruttidrama-afk/Frutti-Drama-Publisher
            org.opencontainers.image.description=Dinnie emergency publisher runtime
            org.opencontainers.image.revision=23e0993b7ce3d14aa796696332847d736c84ec18

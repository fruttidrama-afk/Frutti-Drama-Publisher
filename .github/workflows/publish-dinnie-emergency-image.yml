name: Publish Dinnie Emergency Runtime Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit SHA to build
        required: true
        default: "52398ad2b3a948659ea33af01e3c7077f7783974"
      image_tag:
        description: Emergency image tag
        required: true
        default: "dinnie-emergency-facebook-auth"

permissions:
  contents: read
  packages: write

concurrency:
  group: dinnie-emergency-runtime-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fruttidrama-afk/publisher-runtime:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/fruttidrama-afk/Frutti-Drama-Publisher
            org.opencontainers.image.description=Dinnie emergency publisher runtime
            org.opencontainers.image.revision=${{ inputs.source_ref }}

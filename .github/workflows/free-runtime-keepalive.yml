name: Free Runtime Keepalive

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publisher-free-runtime-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep scheduled automation active
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          printf 'last_keepalive_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > ops/free-runtime-heartbeat.txt
          if git diff --quiet -- ops/free-runtime-heartbeat.txt; then
            exit 0
          fi
          git config user.name "publisher-runtime-bot"
          git config user.email "publisher-runtime-bot@users.noreply.github.com"
          git add ops/free-runtime-heartbeat.txt
          git commit -m "Keep free runtime scheduler active"
          git push origin HEAD:main

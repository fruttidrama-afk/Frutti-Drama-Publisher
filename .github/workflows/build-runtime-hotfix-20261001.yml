name: Build publisher runtime hotfix 20261001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-runtime-hotfix-20261001.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push exact runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/fruttidrama-afk/publisher-runtime:sha-${GITHUB_SHA}"
          docker build --pull -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_STEP_SUMMARY"

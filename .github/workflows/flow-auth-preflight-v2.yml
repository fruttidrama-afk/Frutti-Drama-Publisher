name: Flow Auth Preflight V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flow-auth-preflight-v2.yml"
      - "scripts/flow-auth-preflight-v2.mjs"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify portable Flow authentication
        run: node scripts/flow-auth-preflight-v2.mjs

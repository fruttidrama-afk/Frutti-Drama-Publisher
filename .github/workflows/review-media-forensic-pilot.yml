name: Historical Video Forensics — Frutti Recovery Batch
on:
  push:
    branches: [main]
    paths:
      - "ops/trigger-review-media-forensics.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publisher-readonly-forensic-media-archive
  cancel-in-progress: false

jobs:
  transcribe-archived-frutti-videos:
    if: contains(github.event.head_commit.message, '[forensic-remaining-20261012]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        start: [3, 10, 17, 24]
    env:
      FORENSIC_BATCH_START: ${{ matrix.start }}
      FORENSIC_BATCH_COUNT: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local CPU-only audio and frame extraction tools
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install "faster-whisper==1.2.1"
      - name: Archive-only MP4 analysis with private Supabase output and OIDC
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: node scripts/review-media-forensic-pilot.mjs

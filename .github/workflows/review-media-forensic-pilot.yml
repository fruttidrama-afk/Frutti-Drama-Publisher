name: Historical Video Forensics — Read Only Pilot
on:
  push:
    branches: [main]
    paths:
      - "ops/trigger-review-media-forensics.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "Use index for existing private reports or analyze to re-extract source video"
        type: choice
        required: true
        default: index
        options: [index, analyze]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publisher-readonly-forensic-media-pilot
  cancel-in-progress: false

jobs:
  private-media-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'analyze'
        with:
          python-version: "3.11"
      - name: Install local open-source audio and video tools
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'analyze'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install "faster-whisper==1.2.1"
      - name: Analyze existing MP4s without changing sources
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'analyze'
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: node scripts/review-media-forensic-pilot.mjs
      - name: Securely index existing private audio-visual reports
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'index'
        run: node scripts/review-media-forensic-index.mjs

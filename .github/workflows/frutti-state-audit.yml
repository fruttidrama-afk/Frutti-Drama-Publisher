name: Frutti Storyboard Prompt Archive Audit — Read Only
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frutti-state-audit.yml"
      - "scripts/frutti-prompt-ledger-audit.mjs"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect-storyboard-prompts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Count original persisted generation prompts, seasons and revisions without revealing prompt text
        run: node scripts/frutti-prompt-ledger-audit.mjs

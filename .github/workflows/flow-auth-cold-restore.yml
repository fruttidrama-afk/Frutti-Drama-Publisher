name: Flow Auth Cold Restore (Read Only)
on:
  # Verify precisely once after a real human-authenticated session is stored.
  # Routine daily probes are intentionally forbidden: they add unnecessary
  # visits from ephemeral cloud browsers and cannot prevent a Google challenge.
  workflow_run:
    workflows:
      - "Bootstrap Flow Frutti Account V2"
      - "Bootstrap Flow Earth Account V2"
      - "Bootstrap Flow Dinnie Account V2"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publisher:
        description: Specific publisher to test; leave blank for all
        required: false
        type: choice
        options: ["",frutti,earth,dinnie]
permissions:
  contents: read
  id-token: write
concurrency:
  group: flow-auth-readonly-cold-restore
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLOW_VERIFY_ONLY: ${{ inputs.publisher || (github.event.workflow_run.name == 'Bootstrap Flow Frutti Account V2' && 'frutti') || (github.event.workflow_run.name == 'Bootstrap Flow Earth Account V2' && 'earth') || (github.event.workflow_run.name == 'Bootstrap Flow Dinnie Account V2' && 'dinnie') || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Syntax preflight
        run: node --check scripts/verify-flow-auth-cold-restore.mjs
      - name: Install browser runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify saved Google Flow login in fresh isolated Chrome with NO Generate clicks
        run: node scripts/verify-flow-auth-cold-restore.mjs

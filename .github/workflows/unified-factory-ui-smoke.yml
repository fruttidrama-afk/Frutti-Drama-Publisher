name: Unified Publisher Factory UI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "factory-web/public/index.html"
      - "scripts/check-unified-factory-ui.mjs"
      - "scripts/test-frutti-copy.mjs"
      - "scripts/check-publication-safety.mjs"
      - "publication.js"
      - "publication-facebook.js"
      - "free-browser-provider.js"
      - "runtime-config.js"
      - "scripts/free-runtime-runner-v2.mjs"
      - "supabase/functions/publisher-frutti-recap/index.ts"
      - "supabase/functions/publisher-frutti-recap/frutti-recap-copy.js"
      - ".github/workflows/unified-factory-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-readonly-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check both Factory UIs without browser, Flow or publication
        run: node scripts/check-unified-factory-ui.mjs
      - name: Validate FruttiDrama narrative metadata without production writes
        run: node scripts/test-frutti-copy.mjs
      - name: Validate syntax and anti-spam two-stage publication contract
        run: |
          node --check publication.js
          node --check publication-facebook.js
          node --check runtime-config.js
          node --check free-browser-provider.js
          node --check scripts/free-runtime-runner-v2.mjs
          node scripts/check-publication-safety.mjs

name: Verify Dinnie Live Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-dinnie-live-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Dinnie to pick up the current runtime
        shell: bash
        run: |
          set -u
          url="https://dinnie-the-dinosaur-production.up.railway.app/factory/health"
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            echo "attempt=$attempt"
            echo "$body" | python -c 'import sys,json; s=sys.stdin.read(); print(s[:5000])' || true
            if echo "$body" | grep -q '"quarantined_submit_recovery_self_heal":true' \
              && echo "$body" | grep -q '"zero_use_credit_rollover_self_heal":true'; then
              echo "Dinnie is running the current autonomous recovery runtime."
              exit 0
            fi
            sleep 20
          done
          echo "Dinnie did not expose the current runtime flags within the verification window."
          exit 1

name: Validate Free Runtime

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "scripts/free-runtime-runner.mjs"
      - ".github/workflows/free-runtime-runner.yml"
      - ".github/workflows/validate-free-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Syntax checks
        run: |
          node --check cloudflare/orchestrator/src/index.js
          node --check scripts/free-runtime-runner.mjs
      - name: Infrastructure policy checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "PUBLISHER_ONESHOT_KIND" scripts/free-runtime-runner.mjs
          grep -Fq "publisher-factory-free-runtime" scripts/free-runtime-runner.mjs
          grep -Fq "id-token: write" .github/workflows/free-runtime-runner.yml
          grep -Fq 'cron: "*/5 * * * *"' .github/workflows/free-runtime-runner.yml
          grep -Fq "Railway is retired" docs/SOP_MASTER_PUBLISHER_FACTORY.md
          curl -fsSL --max-time 20 "https://wrflttnmlrsuzuukdhtf.supabase.co/functions/v1/publisher-free-runtime/health" | jq -e '.ok == true and .version == "publisher-free-runtime-supabase-v1"' >/dev/null
          # Cloudflare remains a tested optional portability adapter, not the active dependency.
          grep -Fq "UNIQUE(publisher_id, local_day, kind, ordinal)" cloudflare/orchestrator/schema.sql

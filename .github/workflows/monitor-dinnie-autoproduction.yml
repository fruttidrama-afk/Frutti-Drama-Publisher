name: Monitor Dinnie Autoproduction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-dinnie-autoproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for autonomous recovery or generation progress
        shell: bash
        run: |
          set -euo pipefail
          url="https://dinnie-the-dinosaur-production.up.railway.app/factory/health"
          for attempt in $(seq 1 40); do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            echo "attempt=$attempt"
            if [ -n "$body" ]; then
              echo "$body" | jq '{at,provider_health,current_job,queue,completed_today,remaining_today,last_generation,last_review_ready,credit_cycle}'
              current="$(echo "$body" | jq -r '.automation_safety.quarantined_submit_recovery_self_heal // false')"
              episode="$(echo "$body" | jq -r '.current_job.episode // 0')"
              status="$(echo "$body" | jq -r '.current_job.status // ""')"
              completed="$(echo "$body" | jq -r '.completed_today // 0')"
              if [ "$current" = "true" ] && { [ "$completed" -ge 1 ] || { [ "$episode" -ge 6 ] && { [ "$status" = "generating" ] || [ "$status" = "review" ]; }; }; }; then
                echo "Dinnie autonomous pipeline progressed beyond the stale E5 hold."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Dinnie did not make autonomous recovery/generation progress within the monitoring window."
          exit 1

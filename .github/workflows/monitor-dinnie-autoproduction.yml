name: Monitor Dinnie Autoproduction

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-dinnie-autoproduction.yml"
      - "unattended-supervisor.js"
      - "free-browser-provider.js"
      - "publication-facebook.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dinnie-autoproduction-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check outcome SLA and self-heal if needed
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://dinnie-the-dinosaur-production.up.railway.app/factory/health"
          autonomy_url="https://dinnie-the-dinosaur-production.up.railway.app/autonomy-status.json"
          redeploy_url="https://wrflttnmlrsuzuukdhtf.supabase.co/functions/v1/dinnie-unattended-runtime-redeploy-20260927"

          age_seconds() {
            python - "$1" <<'PY'
          import sys,datetime
          try:
              t=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
              print(max(0,int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds())))
          except Exception:
              print(999999999)
          PY
          }

          publication_overdue() {
            python - "$1" <<'PY'
          import sys,datetime
          from zoneinfo import ZoneInfo
          raw=sys.argv[1]
          try:
              t=datetime.datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(ZoneInfo('America/Argentina/Buenos_Aires'))
          except Exception:
              print('true'); raise SystemExit
          now=datetime.datetime.now(ZoneInfo('America/Argentina/Buenos_Aires'))
          print('true' if now.hour>=20 and t.date()!=now.date() else 'false')
          PY
          }

          check_health() {
            body="$(curl -fsSL --max-time 20 "$health_url" || true)"
            if [ -z "$body" ]; then
              echo "Dinnie health endpoint is unavailable."
              return 1
            fi
            echo "$body" | jq '{at,publisher_enabled,scheduler_alive,worker_alive,automation_provider,publication_provider,provider_health,current_job,queue,completed_today,remaining_today,last_generation,last_publication,credit_cycle}'

            ok="$(echo "$body" | jq -r '.ok // false')"
            enabled="$(echo "$body" | jq -r '.publisher_enabled // false')"
            scheduler="$(echo "$body" | jq -r '.scheduler_alive // false')"
            worker="$(echo "$body" | jq -r '.worker_alive // false')"
            provider="$(echo "$body" | jq -r '.automation_provider // ""')"
            publication="$(echo "$body" | jq -r '.publication_provider // ""')"
            remaining="$(echo "$body" | jq -r '.remaining_today // 0')"
            last_generation="$(echo "$body" | jq -r '.last_generation // empty')"
            last_publication="$(echo "$body" | jq -r '.last_publication.updatedAt // empty')"
            stock="$(echo "$body" | jq -r '(.queue.queued // 0) + (.queue.historical // 0)')"

            if [ "$ok" != "true" ] || [ "$enabled" != "true" ] || [ "$scheduler" != "true" ] || [ "$worker" != "true" ] || [ "$provider" != "FreeBrowserProvider" ] || [ "$publication" != "FacebookReelsProvider" ]; then
              echo "Runtime liveness contract failed."
              return 1
            fi

            if [ "$remaining" -gt 0 ]; then
              if [ -z "$last_generation" ]; then
                echo "Generation SLA failed: work remains but no successful generation exists."
                return 1
              fi
              gen_age="$(age_seconds "$last_generation")"
              if [ "$gen_age" -gt 10800 ]; then
                echo "Generation SLA failed: last successful generation is ${gen_age}s old while ${remaining} videos remain today."
                return 1
              fi
            fi

            if [ "$stock" -gt 0 ]; then
              if [ -z "$last_publication" ]; then
                local_hour="$(TZ=America/Argentina/Buenos_Aires date +%H)"
                if [ "$local_hour" -ge 20 ]; then
                  echo "Publication SLA failed: stock exists but no confirmed publication exists."
                  return 1
                fi
              elif [ "$(publication_overdue "$last_publication")" = "true" ]; then
                echo "Publication SLA failed: stock exists but no Reel was confirmed today after the release window."
                return 1
              fi
            fi

            auto="$(curl -fsSL --max-time 10 "$autonomy_url" || true)"
            if [ -n "$auto" ]; then
              echo "$auto" | jq '{version,generation,publication,quarantine}' || true
              auto_ok="$(echo "$auto" | jq -r '.ok // false')"
              if [ "$auto_ok" != "true" ]; then
                echo "Autonomy supervisor reports unhealthy state."
                return 1
              fi
            fi
            return 0
          }

          if check_health; then
            echo "Dinnie outcome SLA is healthy."
            exit 0
          fi

          echo "Dinnie watchdog detected an outcome failure; requesting one bounded Railway recovery."
          response_file="$(mktemp)"
          status="$(curl -sSL --max-time 60 -o "$response_file" -w '%{http_code}' "$redeploy_url" || true)"
          cat "$response_file" || true
          echo
          echo "recovery_controller_http_status=$status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Dinnie recovery controller could not redeploy Railway. The controller persisted the infrastructure error and the watchdog will retry later without creating commits or paging every cycle."
            exit 0
          fi

          for attempt in $(seq 1 20); do
            sleep 15
            if check_health; then
              echo "Dinnie autonomous runtime recovered after redeploy."
              exit 0
            fi
            echo "recovery_check=$attempt"
          done

          echo "::warning::Dinnie unattended runtime did not recover within the watchdog window. The incident remains visible in Actions without generating repeated failure email."
          exit 0
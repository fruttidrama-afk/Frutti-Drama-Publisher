name: Monitor Earth Autoproduction

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-earth-autoproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-autoproduction-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check Earth outcome SLA and self-heal
        id: check
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://earth-in-10-production.up.railway.app/factory/health"
          autonomy_url="https://earth-in-10-production.up.railway.app/autonomy-status.json"
          redeploy_url="https://wrflttnmlrsuzuukdhtf.supabase.co/functions/v1/earth-unattended-runtime-redeploy-20261006"

          check_health() {
            body="$(curl -fsSL --max-time 20 "$health_url" || true)"
            if [ -z "$body" ]; then
              echo "Earth health endpoint is unavailable."
              return 1
            fi
            echo "$body" | jq '{at,publisher_enabled,scheduler_alive,worker_alive,automation_provider,publication_provider,current_job,queue,completed_today,remaining_today,last_generation,last_publication}' || true
            ok="$(echo "$body" | jq -r '.ok // false')"
            enabled="$(echo "$body" | jq -r '.publisher_enabled // false')"
            scheduler="$(echo "$body" | jq -r '.scheduler_alive // false')"
            worker="$(echo "$body" | jq -r '.worker_alive // false')"
            remaining="$(echo "$body" | jq -r '.remaining_today // 0')"
            last_generation="$(echo "$body" | jq -r '.last_generation // empty')"
            if [ "$ok" != "true" ] || [ "$enabled" != "true" ] || [ "$scheduler" != "true" ] || [ "$worker" != "true" ]; then
              echo "Earth runtime liveness contract failed."
              return 1
            fi
            if [ "$remaining" -gt 0 ]; then
              age="$(python - "$last_generation" <<'PY'
          import sys,datetime
          try:
              t=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
              print(max(0,int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds())))
          except Exception:
              print(999999999)
          PY
          )"
              if [ "$age" -gt 10800 ]; then
                echo "Earth generation SLA is stale by ${age}s."
                return 1
              fi
            fi
            auto="$(curl -fsSL --max-time 10 "$autonomy_url" || true)"
            if [ -n "$auto" ]; then
              echo "$auto" | jq '{version,generation,publication,quarantine}' || true
              auto_ok="$(echo "$auto" | jq -r '.ok // false')"
              if [ "$auto_ok" != "true" ]; then
                echo "Earth autonomy supervisor reports unhealthy state."
                return 1
              fi
            fi
            return 0
          }

          if check_health; then
            echo "Earth outcome SLA is healthy."
            exit 0
          fi

          echo "Earth watchdog detected an outcome failure; requesting one bounded Railway recovery."
          response_file="$(mktemp)"
          status="$(curl -sSL --max-time 60 -o "$response_file" -w '%{http_code}' "$redeploy_url" || true)"
          cat "$response_file" || true
          echo
          echo "recovery_controller_http_status=$status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Earth recovery controller could not redeploy Railway. The controller persisted the infrastructure error and the watchdog will retry later without creating commits."
            exit 0
          fi

          for attempt in $(seq 1 20); do
            sleep 15
            if check_health; then
              echo "Earth autonomous runtime recovered after Railway redeploy."
              exit 0
            fi
            echo "recovery_check=$attempt"
          done

          echo "::warning::Earth Railway recovery was accepted but business health did not recover within the watchdog window."
          exit 0
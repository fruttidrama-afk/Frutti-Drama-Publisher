name: Monitor Earth Autoproduction

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-earth-autoproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-autoproduction-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Earth outcome SLA
        id: check
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://earth-in-10-production.up.railway.app/factory/health"
          autonomy_url="https://earth-in-10-production.up.railway.app/autonomy-status.json"
          body="$(curl -fsSL --max-time 20 "$health_url" || true)"
          unhealthy=false
          reason=""
          if [ -z "$body" ]; then
            unhealthy=true; reason="health-endpoint-unavailable"
          else
            echo "$body" | jq '{at,publisher_enabled,scheduler_alive,worker_alive,automation_provider,publication_provider,current_job,queue,completed_today,remaining_today,last_generation,last_publication}'
            ok="$(echo "$body" | jq -r '.ok // false')"
            enabled="$(echo "$body" | jq -r '.publisher_enabled // false')"
            scheduler="$(echo "$body" | jq -r '.scheduler_alive // false')"
            worker="$(echo "$body" | jq -r '.worker_alive // false')"
            remaining="$(echo "$body" | jq -r '.remaining_today // 0')"
            last_generation="$(echo "$body" | jq -r '.last_generation // empty')"
            if [ "$ok" != "true" ] || [ "$enabled" != "true" ] || [ "$scheduler" != "true" ] || [ "$worker" != "true" ]; then
              unhealthy=true; reason="runtime-liveness-contract"
            elif [ "$remaining" -gt 0 ]; then
              age="$(python - "$last_generation" <<'PY'
          import sys,datetime
          try:
              t=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
              print(max(0,int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds())))
          except Exception:
              print(999999999)
          PY
          )"
              if [ "$age" -gt 10800 ]; then unhealthy=true; reason="generation-sla-stale-${age}s"; fi
            fi
          fi
          auto="$(curl -fsSL --max-time 10 "$autonomy_url" || true)"
          if [ -n "$auto" ]; then echo "$auto" | jq '{version,generation,publication,quarantine}' || true; fi
          echo "unhealthy=$unhealthy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Record degraded state without paging the operator
        if: steps.check.outputs.unhealthy == 'true'
        shell: bash
        run: |
          echo "::warning::Earth unattended outcome SLA is unhealthy: ${{ steps.check.outputs.reason }}"
          echo "The watchdog intentionally does not fail the workflow or create self-heal commits."
          echo "Railway deployment recovery is handled separately; repeated Git commits cannot repair a missing/failed deployment and only create mail/Pages churn."
          exit 0

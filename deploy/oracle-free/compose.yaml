# Draft OCI Always Free deployment for three isolated existing shows.
# Never deploy until manual preactivation. Bare docker compose up starts nothing.
# Every publisher remains OFF even after an explicit opt-in Compose profile.
services:
  publisher-fruttidrama:
    profiles: ["explicit-publisher"]
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PUBLISHER_ENABLED: "false"
      PUBLISHER_ENABLE_AFTER_MANUAL_ACTIVATION: "true"
      PUBLISHER_CHANNEL_ID: fruttidrama
      CHROMIUM_PATH: /usr/bin/chromium
      FLOW_CHROME_PATH: /usr/bin/chromium
      PUBLISHER_GLOBAL_FLOW_LOCK_PATH: /flow-lock/flow.lock
      PUBLISHER_GLOBAL_ACTIVATION_FILE: /activation/operator-activation.json
      NODE_ENV: production
    env_file:
      - .env
      - ./channels/fruttidrama.env
    volumes:
      - ./data/fruttidrama:/data
      - ./flow-lock:/flow-lock
      - ./activation:/activation:ro
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    shm_size: "512mb"
    mem_limit: "3g"
    cpus: "0.5"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8080/factory/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  publisher-earth-in-10:
    profiles: ["explicit-publisher"]
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PUBLISHER_ENABLED: "false"
      PUBLISHER_ENABLE_AFTER_MANUAL_ACTIVATION: "true"
      PUBLISHER_CHANNEL_ID: earth-in-10
      CHROMIUM_PATH: /usr/bin/chromium
      FLOW_CHROME_PATH: /usr/bin/chromium
      PUBLISHER_GLOBAL_FLOW_LOCK_PATH: /flow-lock/flow.lock
      PUBLISHER_GLOBAL_ACTIVATION_FILE: /activation/operator-activation.json
      NODE_ENV: production
    env_file:
      - .env
      - ./channels/earth-in-10.env
    volumes:
      - ./data/earth-in-10:/data
      - ./flow-lock:/flow-lock
      - ./activation:/activation:ro
    ports:
      - "127.0.0.1:8082:8080"
    security_opt:
      - no-new-privileges:true
    shm_size: "512mb"
    mem_limit: "3g"
    cpus: "0.5"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8080/factory/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  publisher-dinnie:
    profiles: ["explicit-publisher"]
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PUBLISHER_ENABLED: "false"
      PUBLISHER_ENABLE_AFTER_MANUAL_ACTIVATION: "true"
      PUBLISHER_CHANNEL_ID: dinnie
      CHROMIUM_PATH: /usr/bin/chromium
      FLOW_CHROME_PATH: /usr/bin/chromium
      PUBLISHER_GLOBAL_FLOW_LOCK_PATH: /flow-lock/flow.lock
      PUBLISHER_GLOBAL_ACTIVATION_FILE: /activation/operator-activation.json
      NODE_ENV: production
    env_file:
      - .env
      - ./channels/dinnie.env
    volumes:
      - ./data/dinnie:/data
      - ./flow-lock:/flow-lock
      - ./activation:/activation:ro
    ports:
      - "127.0.0.1:8083:8080"
    security_opt:
      - no-new-privileges:true
    shm_size: "512mb"
    mem_limit: "3g"
    cpus: "0.5"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8080/factory/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  hub:
    profiles: ["reconstruction-dashboard"]
    image: node:24-alpine
    restart: unless-stopped
    command: ["node","/app/factory-hub.mjs"]
    environment:
      HUB_PORT: "8081"
      HUB_LISTEN_HOST: "0.0.0.0"
      PUBLISHER_HUB_MANIFEST: /data/factory-hub/channels.json
      PUBLISHER_HUB_DATA_ROOT: /data/publisher
      PUBLISHER_RECONCILIATION_MEDIA_ROOT: /data/reconciliation-media
      PUBLISHER_RECONCILIATION_STORE_ROOT: /data/reconciliation
      PUBLISHER_GLOBAL_ACTIVATION_FILE: /activation/operator-activation.json
      PUBLISHER_HUB_ACTIVATION_ARMED: "false"
    env_file:
      - .env
    volumes:
      - ../../factory-hub.mjs:/app/factory-hub.mjs:ro
      - ../../reconciliation-studio.mjs:/app/reconciliation-studio.mjs:ro
      - ../../public/reconciliation.html:/app/public/reconciliation.html:ro
      - ./hub:/data/factory-hub:ro
      - ./reconciliation-media:/data/reconciliation-media:ro
      - ./reconciliation:/data/reconciliation
      - ./data:/data/publisher
      - ./activation:/activation
    ports:
      - "127.0.0.1:8081:8081"
    security_opt:
      - no-new-privileges:true
    mem_limit: "256m"
    cpus: "0.25"

  # Opt-in PUBLIC HTTPS gateway only. NEVER starts automatically and never
  # exposes any child runtime, OAuth profile, Flow port, or SQLite storage.
  # Caddy terminates TLS; Hub remains authenticated and localhost-bound.
  https-gateway:
    profiles: ["explicit-https-gateway"]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      PUBLISHER_HTTPS_HOSTNAME: "${PUBLISHER_HTTPS_HOSTNAME:-not-configured.invalid}"
    volumes:
      - ./https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./https/caddy-data:/data
      - ./https/caddy-config:/config
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    security_opt:
      - no-new-privileges:true
    mem_limit: "256m"
    cpus: "0.25"

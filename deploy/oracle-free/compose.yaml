# Draft OCI Always Free deployment. Never deploy until audits pass.
services:
  publisher:
    profiles: ["explicit-publisher"]
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PUBLISHER_ENABLED: "false"
      CHROMIUM_PATH: /usr/bin/chromium
      FLOW_CHROME_PATH: /usr/bin/chromium
      PUBLISHER_GLOBAL_FLOW_LOCK_PATH: /flow-lock/flow.lock
      PUBLISHER_GLOBAL_ACTIVATION_FILE: /activation/operator-activation.json
      NODE_ENV: production
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./flow-lock:/flow-lock
      - ./activation:/activation:ro
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    mem_limit: "7g"
    cpus: "1.5"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8080/factory/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  hub:
    profiles: ["reconstruction-dashboard"]
    image: node:24-alpine
    restart: unless-stopped
    command: ["node","/app/factory-hub.mjs"]
    environment:
      HUB_PORT: "8081"
      HUB_LISTEN_HOST: "0.0.0.0"
      PUBLISHER_HUB_MANIFEST: /data/factory-hub/channels.json
      PUBLISHER_GLOBAL_ACTIVATION_FILE: /activation/operator-activation.json
      PUBLISHER_HUB_ACTIVATION_ARMED: "false"
    env_file:
      - .env
    volumes:
      - ../../factory-hub.mjs:/app/factory-hub.mjs:ro
      - ./hub:/data/factory-hub:ro
      - ./data:/data/publisher
      - ./activation:/activation
    ports:
      - "127.0.0.1:8081:8081"
    security_opt:
      - no-new-privileges:true
    mem_limit: "256m"
    cpus: "0.25"

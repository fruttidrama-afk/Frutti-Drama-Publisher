# Draft OCI Always Free deployment. Never deploy until audits pass.
services:
  publisher:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PUBLISHER_ENABLED: "true"
      CHROMIUM_PATH: /usr/bin/chromium
      FLOW_CHROME_PATH: /usr/bin/chromium
      PUBLISHER_GLOBAL_FLOW_LOCK_PATH: /global/flow.lock
      NODE_ENV: production
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./global:/global
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    mem_limit: "7g"
    cpus: "1.5"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8080/factory/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

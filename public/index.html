<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f3f3"><title>Publisher</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--ink:#050505;--muted:#6d6d6d;--line:#d5d5d5;--soft:#ededed;--black:#000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.shell{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-size:26px;font-weight:820;letter-spacing:-.045em}.muted{color:var(--muted);line-height:1.5}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:#000;color:#fff;border-color:#000}.btn.approve{background:#000;color:#fff;border-color:#000}.btn.redo{background:#fff;color:#111;border-color:#bdbdbd}.hero{padding:36px 0 20px}.hero h1{font-size:clamp(40px,8vw,72px);letter-spacing:-.065em;line-height:.95;margin:0 0 14px}.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.status{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;min-height:122px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.value{font-size:23px;font-weight:800;letter-spacing:-.04em;margin:13px 0 4px}.tabs{margin:20px 0 12px}.tab.active{background:#000;color:#fff;border-color:#000}.panel{display:none}.panel.active{display:block}.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.review{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}.video{background:#151515;aspect-ratio:9/16;max-height:560px;width:100%;object-fit:contain}.review-body{padding:16px}.review h3{margin:0;font-size:22px;letter-spacing:-.04em}.review .story{font-size:14px;color:var(--muted);margin:8px 0 14px;line-height:1.5}.review-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.table{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.row{display:grid;grid-template-columns:80px 1fr 170px 130px;gap:10px;padding:13px 16px;border-top:1px solid var(--line);align-items:center}.row:first-child{border-top:0}.empty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;color:var(--muted)}pre{white-space:pre-wrap;background:#000;color:#eee;padding:16px;border-radius:16px;overflow:auto;font-size:12px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:999px;display:none;z-index:10}
@media(max-width:820px){
.status-grid{grid-template-columns:1fr 1fr}
.review-grid{grid-template-columns:1fr}
.row{grid-template-columns:70px 1fr}
.row>:nth-child(3),.row>:nth-child(4){grid-column:2}
.top{flex-direction:column}
.top .actions{
  width:calc(100vw - 28px);
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  flex-wrap:nowrap;
  padding:2px 2px 8px;
  margin-right:calc(-1 * env(safe-area-inset-right));
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.top .actions::-webkit-scrollbar{display:none}
.top .btn{white-space:nowrap;flex:0 0 auto}
.shell{padding:14px}
}
@media(max-width:430px){
.status{min-height:112px;padding:14px}
.value{font-size:21px}
.hero h1{font-size:48px}
.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;white-space:nowrap}
}
</style></head><body><main class=shell>
<header class=top><div><div class=brand id=publisherName>Publisher</div><div class=muted id=showName>Loading…</div></div><div class=actions><a class=btn href="/flow/bootstrap">Conectar Flow</a><a class=btn href="/integrations/youtube">YouTube</a><a class=btn href="/security">Seguridad</a><a class=btn href="/api/config/export">Exportar configuración</a></div></header>
<section class=hero><h1 id=hero>Autonomous Publisher</h1><p class=muted>La generación, revisión y publicación programada continúan en segundo plano aunque cierres esta página.</p></section>
<section class=status-grid>
<div class=status><div class=label>Google Flow</div><div class=value id=flowValue>—</div><div class=muted id=flowDetail></div></div>
<div class=status><div class=label>Automatización</div><div class=value id=workerValue>—</div><div class=muted>FreeBrowserProvider</div></div>
<div class=status><div class=label>Hoy</div><div class=value id=dailyValue>—</div><div class=muted id=dailyDetail></div></div>
<div class=status><div class=label>YouTube</div><div class=value id=ytValue>—</div><div class=muted id=ytDetail></div></div>
</section>
<nav class=tabs><button class="btn tab active" data-tab=review>Revisión</button><button class="btn tab" data-tab=queue>Publicación</button><button class="btn tab" data-tab=advanced>Avanzado</button></nav>
<section class="panel active" id=review><div id=reviews class=review-grid></div></section>
<section class=panel id=queue><div id=queueBox class=table></div></section>
<section class=panel id=advanced><div class=actions><button class=btn id=refresh>Actualizar</button><button class=btn id=run>Ejecutar scheduler</button></div><pre id=health></pre></section>
</main><div class=toast id=toast></div>
<script>
const $=s=>document.querySelector(s);let health=null;
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function fmt(v){if(!v)return'—';try{return new Intl.DateTimeFormat('es-AR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}}
async function load(){
 const [s,cards,pub]=await Promise.all([api('/api/status'),api('/factory/cards'),api('/publication/items')]);health=s.health;
 $('#publisherName').textContent=health.show;$('#showName').textContent='Publisher Runtime '+health.runtime_version;$('#hero').textContent=health.show;
 $('#flowValue').textContent=health.flow.authenticated?'Conectado':(health.flow.configured?'Falta configurar':'Sin configurar');$('#flowDetail').textContent=health.flow.project_name||'Elegí un proyecto de Flow';
 $('#workerValue').textContent=health.worker_alive?'Activo':'Esperando';$('#dailyValue').textContent=health.completed_today+' / '+health.daily_target;$('#dailyDetail').textContent=health.remaining_today+' restantes';
 $('#ytValue').textContent=s.youtube.connected?'Conectado':(s.youtube.oauthConfigured?'Falta iniciar sesión':'Falta configurar');$('#ytDetail').textContent=health.publication_provider;
 $('#health').textContent=JSON.stringify(health,null,2);renderReviews(cards.cards||[]);renderQueue(pub.items||[]);
}
function renderReviews(items){const box=$('#reviews');box.innerHTML='';if(!items.length){box.innerHTML='<div class=empty>No hay videos esperando revisión.</div>';return}for(const x of items){const c=document.createElement('article');c.className='review';c.innerHTML=(x.videoUrl?'<video class=video controls playsinline src="'+x.videoUrl+'"></video>':'<div class="video"></div>')+'<div class=review-body><div class=label>Episodio '+x.episode+(x.archivedOriginal?' · original archivado de forma segura':'')+'</div><h3></h3><div class=story></div><div class=review-actions><button class="btn redo">Rehacer</button><button class="btn approve">Aprobar</button></div></div>';c.querySelector('h3').textContent=x.title||x.hook;c.querySelector('.story').textContent=x.story;c.querySelector('.approve').onclick=()=>decide(x.id,'approve',c);c.querySelector('.redo').onclick=()=>decide(x.id,'reject',c);box.append(c)}}
async function decide(id,kind,card){for(const b of card.querySelectorAll('button'))b.disabled=true;try{await api('/factory/'+id+'/'+kind,{method:'POST',body:'{}'});toast(kind==='approve'?'Aprobado y enviado a la cola':'Regeneración programada');await load()}catch(e){toast(e.message);for(const b of card.querySelectorAll('button'))b.disabled=false}}
function renderQueue(items){const box=$('#queueBox');box.innerHTML='';if(!items.length){box.innerHTML='<div class=empty>Todavía no hay videos programados.</div>';return}for(const x of items){const r=document.createElement('div');r.className='row';r.innerHTML='<strong>E'+x.episode+'</strong><div><strong></strong><div class=muted></div></div><div></div><div></div>';r.children[1].querySelector('strong').textContent=x.title;r.children[1].querySelector('.muted').textContent=x.error||'';r.children[2].textContent=fmt(x.scheduledAt);r.children[3].textContent=x.status;box.append(r)}}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')};
$('#refresh').onclick=load;$('#run').onclick=async()=>{await api('/publication/run',{method:'POST',body:'{}'});toast('Scheduler ejecutado');setTimeout(load,800)};load();setInterval(load,30000);
</script></body></html>

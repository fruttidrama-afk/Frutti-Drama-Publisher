<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Security</title><style>
body{margin:0;background:#f5f4ef;color:#171717;font-family:system-ui;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.wrap{max-width:850px;margin:auto}.card{background:white;border:1px solid #e3dfd4;border-radius:20px;padding:20px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#73716a;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 180px}input,button,a.btn{min-height:44px;padding:11px 13px;border:1px solid #ddd;border-radius:12px;background:white;font:inherit;box-sizing:border-box}button{font-weight:750}.primary{background:#111!important;color:white}.item{padding:13px 0;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:12px;align-items:center}.item:first-child{border-top:0}.badge{font-size:11px;background:#eef3e9;padding:4px 8px;border-radius:999px;margin-left:6px}@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.item button{width:100%}}</style></head><body><main class=wrap><div class=top><div><h1>Security</h1><div class=muted>Passkeys, recovery PIN and active sessions.</div></div><a class=btn href="/">Back</a></div>
<section class=card><h2>Passkeys</h2><p class=muted>Use Face ID, Touch ID, Windows Hello or a security key. Biometric data never reaches the Publisher.</p><div class=row><input id=name placeholder="Passkey name"><button class=primary id=create>Create passkey</button></div><div id=keys></div><div id=km class=muted></div></section>
<section class=card><h2>Recovery PIN</h2><div class=row><input id=current inputmode=numeric maxlength=6 placeholder="Current PIN"><input id=next inputmode=numeric maxlength=6 placeholder="New PIN"><button id=change>Change PIN</button></div><div id=pm class=muted></div></section>
<section class=card><h2>Active sessions</h2><div id=sessions></div></section>
<section class=card><button id=logout>Log out this device</button></section>
</main><script>
const $=s=>document.querySelector(s);async function j(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}function b(v){const s=v.replace(/-/g,'+').replace(/_/g,'/'),p=s+'='.repeat((4-s.length%4)%4),raw=atob(p),o=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)o[i]=raw.charCodeAt(i);return o}function e(v){let s='';for(const x of new Uint8Array(v))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function fmt(v){try{return new Intl.DateTimeFormat('es-AR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}}
async function load(){const [k,s]=await Promise.all([j('/auth/passkeys'),j('/auth/sessions')]);const kb=$('#keys');kb.innerHTML='';for(const x of k.passkeys){const r=document.createElement('div');r.className='item';r.innerHTML='<div><strong></strong><div class=muted></div></div><button>Delete</button>';r.querySelector('strong').textContent=x.name;r.querySelector('.muted').textContent='Created '+fmt(x.createdAt)+(x.lastUsedAt?' · Last used '+fmt(x.lastUsedAt):'');r.querySelector('button').disabled=k.passkeys.length<=1;r.querySelector('button').onclick=async()=>{await j('/auth/passkeys/'+encodeURIComponent(x.id),{method:'DELETE'});load()};kb.append(r)}if(!k.passkeys.length)kb.textContent='No passkeys yet.';const sb=$('#sessions');sb.innerHTML='';for(const x of s.sessions){const r=document.createElement('div');r.className='item';r.innerHTML='<div><strong></strong><div class=muted></div></div><button>Close session</button>';r.querySelector('strong').textContent=x.device+(x.current?' · This session':'');r.querySelector('.muted').textContent='Last activity '+fmt(x.lastSeenAt);r.querySelector('button').onclick=async()=>{await j('/auth/sessions/'+x.id,{method:'DELETE'});if(x.current)location.replace('/login');else load()};sb.append(r)}}
$('#create').onclick=async()=>{try{const o=await j('/auth/passkeys/register/options',{method:'POST',body:'{}'}),binding=o._binding;o.challenge=b(o.challenge);o.user.id=b(o.user.id);o.excludeCredentials=(o.excludeCredentials||[]).map(x=>({...x,id:b(x.id)}));const c=await navigator.credentials.create({publicKey:o}),credential={id:c.id,rawId:e(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment||undefined,clientExtensionResults:c.getClientExtensionResults?.()||{},response:{attestationObject:e(c.response.attestationObject),clientDataJSON:e(c.response.clientDataJSON),transports:c.response.getTransports?.()||[]}};await j('/auth/passkeys/register/verify',{method:'POST',body:JSON.stringify({credential,name:$('#name').value,_binding:binding})});$('#name').value='';$('#km').textContent='Passkey created.';load()}catch(x){$('#km').textContent=x.message}};
$('#change').onclick=async()=>{try{await j('/auth/pin/change',{method:'POST',body:JSON.stringify({currentPin:$('#current').value,newPin:$('#next').value})});$('#current').value=$('#next').value='';$('#pm').textContent='PIN updated.'}catch(x){$('#pm').textContent=x.message}};
$('#logout').onclick=async()=>{await j('/auth/logout',{method:'POST',body:'{}'});location.replace('/login')};load();
</script></body></html>
